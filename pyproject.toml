[project]
name = "doc-pipeline-api"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [
    { name = "Q1-in-Dublin", email = "changeurself93@gmail.com" }
]
requires-python = ">=3.12"
dependencies = [
    "openpyxl>=3.1.5",
    "pydantic-settings>=2.16.3",
]

[project.scripts]
doc-pipeline-api = "doc_pipeline_api:main"

[build-system]
requires = ["uv_build>=0.12.6,<0.13.0"]
build-backend = "uv_build"

[tool.hatch.build.targets.wheel]
packages = ["src/doc_pipeline_api"]

[dependency-groups]
dev = [
    "mypy>=2.4.1",
    "pytest>=9.2.0",
    "ruff>=0.17.6",
]

[tool.ruff]
line-length = 88
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]
